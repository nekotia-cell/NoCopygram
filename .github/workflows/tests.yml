name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Check roulette asset path
        run: python -c "import os; from assets.gifs import ROULETTE_GIF; expected=os.path.abspath('roleta.gif.mp4'); assert ROULETTE_GIF == expected, (ROULETTE_GIF, expected); print('roulette_asset_path='+ROULETTE_GIF); print('roulette_asset_exists='+str(os.path.isfile(ROULETTE_GIF)))"
